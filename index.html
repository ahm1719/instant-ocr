<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instant OCR — Extract Text from Image</title>
  <meta name="description" content="Extract text from any image using Tesseract.js">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://tessdata.projectnaptha.com" crossorigin>

  <!-- Load Tesseract.js v5 -->
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      background:#0f172a;color:#e5e7eb;font-family:system-ui, sans-serif;
      margin:0;padding:20px;max-width:900px;margin-inline:auto;
    }
    h1{color:#22d3ee}
    .card{background:#111827;padding:20px;border-radius:12px;margin-bottom:20px}
    textarea{width:100%;min-height:300px;background:#020617;color:#e5e7eb;
      border:1px solid #334155;border-radius:12px;padding:10px}
    button{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;margin-top:10px}
    .primary{background:#3b82f6;color:#fff}
    .secondary{background:#1f2937;color:#fff}
  </style>
</head>
<body>
  <h1>Instant OCR</h1>
  <p>Drop, paste, or upload an image — extract selectable text instantly.</p>

  <div class="card">
    <input type="file" id="file" accept="image/*" />
    <select id="lang">
      <option value="eng" selected>English</option>
      <option value="ara">Arabic</option>
      <option value="fra">French</option>
      <option value="spa">Spanish</option>
    </select>
    <button id="run" class="primary">Extract Text</button>
  </div>

  <div class="card">
    <h3>Result</h3>
    <textarea id="output" placeholder="Extracted text will appear here..."></textarea>
    <button id="copy" class="secondary">Copy</button>
  </div>

  <script>
    const fileInput = document.getElementById('file');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copy');
    const langSel = document.getElementById('lang');
    const runBtn = document.getElementById('run');

    runBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return alert('Please choose an image first.');

      output.value = "Loading OCR engine...";
      runBtn.disabled = true;

      const worker = await Tesseract.createWorker({
        workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
        corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.0.0/tesseract-core.wasm.js',
        langPath: 'https://tessdata.projectnaptha.com/4.0.0_best',
        logger: m => {
          if (m.status) output.value = m.status + (m.progress ? ` (${(m.progress*100).toFixed(0)}%)` : '');
        }
      });

      await worker.loadLanguage(langSel.value);
      await worker.initialize(langSel.value);
      const { data } = await worker.recognize(file);
      await worker.terminate();

      output.value = data.text || "(no text detected)";
      runBtn.disabled = false;
    });

    copyBtn.addEventListener('click', async () => {
      await navigator.clipboard.writeText(output.value);
      copyBtn.textContent = "Copied!";
      setTimeout(() => copyBtn.textContent = "Copy", 1500);
    });
  </script>
</body>
</html>
